name: CI/CD Pipeline

on:
  push:
    branches: ['**']  # Run on all branch pushes

# Least privilege permissions
permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: latest

      - name: Run pre-commit checks
        run: pixi run -e default pre-commit run --all-files
        continue-on-error: false

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.4.1
        with:
          pixi-version: latest

      - name: Install dependencies
        run: pixi install

      - name: Prepare compose env files
        run: |
          cp .env.example .env
          cp .env.docker.example .env.docker

      - name: Run full test suite (includes coverage)
        run: pixi run test
        continue-on-error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false  # Don't block CI if Codecov fails (optional service)
          flags: unittests
          name: codecov-${{ matrix.python-version }}

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Lint and Format: ${{ needs.lint-and-format.result }}"
          echo "Tests: ${{ needs.test.result }}"

          if [ "${{ needs.lint-and-format.result }}" != "success" ]; then
            echo "❌ Code quality checks failed"
            exit 1
          fi

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi

          echo "✅ All checks passed!"
